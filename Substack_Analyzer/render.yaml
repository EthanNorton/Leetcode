services:
  - type: web
    name: substack-analyzer
    env: python
    region: oregon
    plan: free
    buildCommand: "cd Substack_Analyzer && pip install -r requirements.txt"
    startCommand: "cd Substack_Analyzer && streamlit run dashboard.py --server.port $PORT --server.address 0.0.0.0 --server.headless true"
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.18
